# Money Manager. Works on a laptop and on the home server:
#   ./setup.sh && docker compose up -d        then open http://localhost:8787
# The images are pulled from GitHub (ghcr.io), so updating is: pull the new images and recreate the containers, in the terminal
# (docker compose pull && docker compose up -d) or with the Update / Pull and redeploy button of Docker Desktop, Portainer or Dockhand.
# To build them from this folder's source instead:  docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# Sample data instead of an empty app:  docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
# Behind Caddy on the shared "proxy" network: add  -f docker-compose.proxy.yml
#
# Networks: the database is only reachable from the app. The scraper is reachable only from the app, and is the
# only container that talks to the banks. Nothing is published except the app, on 127.0.0.1 by default.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: money
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./setup.sh first}
      POSTGRES_DB: money
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money"]
      interval: 5s
      retries: 10

  app:
    image: ghcr.io/userofit123/moneymanager:${MM_VERSION:-latest}   # published with every release; Docker Desktop, Portainer, Dockhand or Watchtower can update it
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://money:${POSTGRES_PASSWORD}@db:5432/money
      DATA_DIR: /data                      # app.key (encryption key for saved credentials) lives here, not in the database
      DOCS_DIR: /data/documents
      SCRAPER_URL: http://scraper:8080
      SCRAPER_KEY: ${SCRAPER_KEY:?run ./setup.sh first}
      HISTORY_DAYS: ${HISTORY_DAYS:-365}
      SESSION_DAYS: ${SESSION_DAYS:-14}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      WISE_TOKEN: ${WISE_TOKEN:-}          # optional; normally enter it in Settings → Connections
    volumes:
      - appdata:/data
      # - /path/on/your/host/backups:/data/backups   # optional: keep the daily backups outside the Docker volume
    ports:
      - "${BIND:-127.0.0.1}:${APP_PORT:-8787}:8080"
    networks: [backend, scraper_net, egress]

  scraper:
    image: ghcr.io/userofit123/moneymanager-scraper:${MM_VERSION:-latest}
    restart: unless-stopped
    environment:
      SCRAPER_KEY: ${SCRAPER_KEY}
      SCRAPER_DEBUG: ${SCRAPER_DEBUG:-0}   # 1 = save a screenshot of where a login got stuck to /debug
    volumes:
      - scraperdebug:/debug
      - scraperprofiles:/profiles          # the browser profile per bank: what makes a bank remember this device
    networks: [scraper_net, egress]
    shm_size: 1gb
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

networks:
  backend: { internal: true }
  scraper_net: { internal: true }
  egress: {}

volumes:
  pgdata:
  appdata:
  scraperdebug:
  scraperprofiles:
