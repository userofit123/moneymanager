<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Money Manager</title>
<style>
  :root { --bg:#fbf8fd; --card:#fff; --tx:#1b1b22; --tx2:#5a5865; --acc:#4355b9; --on:#fff; --ol:#0000001c; --neg:#c0392b; --pos:#1b7f4b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161c; --card:#1d2027; --tx:#e8e6ee; --tx2:#a6a4b2; --acc:#aab4ff; --on:#0b1550; --ol:#ffffff1f; --neg:#ff8a7a; --pos:#6fd39a; } }
  * { box-sizing: border-box; }
  html { direction: ltr; }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif; padding:28px 24px 40px; }
  html.he body { direction: rtl; }
  main { max-width:520px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 6px; }
  p.sub { margin:0 0 20px; color:var(--tx2); }
  .card { background:var(--card); border:1px solid var(--ol); border-radius:18px; padding:16px 18px; margin-bottom:12px; }
  .row { display:flex; align-items:center; gap:12px; }
  .grow { flex:1; min-width:0; }
  .nm { font-weight:650; }
  .ad, .ds { color:var(--tx2); font-size:13px; overflow-wrap:anywhere; }
  .tag { font-size:11px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:var(--acc); }
  button { font:inherit; cursor:pointer; border-radius:99px; padding:8px 18px; border:1px solid var(--ol); background:transparent; color:var(--tx); }
  button.p { background:var(--acc); color:var(--on); border-color:transparent; font-weight:650; }
  button.now { background:transparent; color:var(--pos); border-color:var(--pos); cursor:default; }
  button.d { color:var(--neg); }
  button:disabled { opacity:.6; cursor:default; }
  h2 { font-size:16px; margin:22px 0 4px; }
  label { display:block; font-size:13px; color:var(--tx2); margin:12px 0 4px; }
  input { width:100%; font:inherit; padding:10px 14px; border-radius:12px; border:1px solid var(--ol); background:transparent; color:var(--tx); }
  input:focus { outline:2px solid var(--acc); outline-offset:1px; }
  .msg { min-height:20px; margin:10px 2px 0; font-size:14px; color:var(--neg); }
  .foot { display:flex; justify-content:flex-end; margin-top:18px; }
</style>
</head>
<body>
<main>
  <h1 id="ti"></h1>
  <p class="sub" id="su"></p>
  <div id="list"></div>
  <h2 id="at"></h2>
  <p class="sub" id="as" style="margin-bottom:0"></p>
  <label for="nm" id="lnm"></label><input id="nm" autocomplete="off">
  <label for="ad" id="lad"></label><input id="ad" autocomplete="off" spellcheck="false" dir="ltr">
  <div class="msg" id="msg" role="status"></div>
  <div class="row" style="margin-top:8px"><button class="p" id="go"></button></div>
  <div class="foot"><button id="cl"></button></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let T = {}, st = null, busy = false;
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fill = (s, v) => String(s).replace(/\{(\w+)\}/g, (_, k) => v[k] ?? "");

function draw() {
  const first = st.active == null || (st.noLocal && !st.list.length);
  $("ti").textContent = T.title; $("su").textContent = st.noLocal ? (first ? T.firstSubApp : T.manageSubApp) : (first ? T.firstSub : T.manageSub);
  $("cl").hidden = first; $("cl").textContent = T.close;
  const box = $("list"); box.textContent = "";
  const entry = (id, name, sub, tag, removable) => {
    const c = el("div", "card row"), g = el("div", "grow");
    if (tag) g.append(el("div", "tag", tag));
    g.append(el("div", "nm", name), el("div", id === "local" ? "ds" : "ad", sub));
    c.append(g);
    if (removable) { const r = el("button", "d", T.remove); r.onclick = () => ask(id, name); c.append(r); }
    const isNow = st.active === id, b = el("button", isNow ? "now" : "p", isNow ? T.openNow : T.open);
    if (isNow) b.disabled = true; else b.onclick = () => window.servers.use(id);
    c.append(b); box.append(c);
  };
  if (!st.noLocal) entry("local", T.local, T.localDesc, "", false); // the phone app has no private database of its own
  st.list.forEach((s) => entry(s.id, s.name, s.url, T.remoteTag, true));
  $("at").textContent = T.addTitle; $("as").textContent = T.addSub;
  $("lnm").textContent = T.name; $("nm").placeholder = T.namePh;
  $("lad").textContent = T.address; $("ad").placeholder = T.addressPh;
  $("go").textContent = busy ? T.checking : T.add; $("go").disabled = busy;
}
async function ask(id, name) { if (confirm(fill(T.removeAsk, { name }))) { st = await window.servers.remove(id); draw(); } }
$("go").onclick = async () => {
  if (busy) return; busy = true; $("msg").textContent = ""; draw();
  const r = await window.servers.add($("nm").value, $("ad").value);
  busy = false;
  if (r.error) { $("msg").textContent = T[r.error] || r.error; draw(); return; }
  st = r.state; $("nm").value = ""; $("ad").value = ""; draw();
  window.servers.use(r.id);
};
$("ad").onkeydown = (e) => { if (e.key === "Enter") $("go").click(); };
$("cl").onclick = () => window.servers.close();
(async () => {
  T = await window.servers.texts(); st = await window.servers.state();
  if (navigator.language.toLowerCase().startsWith("he")) document.documentElement.classList.add("he");
  document.title = "Money Manager"; draw();
})();
</script>
</body>
</html>
