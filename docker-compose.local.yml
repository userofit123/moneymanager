# Local testing: docker compose -f docker-compose.local.yml up -d --build
# Open http://localhost:8787 (change with APP_PORT=9000 ...). Loads sample data on first start, restarts by itself.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: money
      POSTGRES_PASSWORD: money
      POSTGRES_DB: money
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money"]
      interval: 5s
      retries: 10

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://money:money@db:5432/money
      DOCS_DIR: /data/documents
      ALLOW_DEMO_SEED: "1"
      AUTO_DEMO_SEED: "1"
      SCHEDULER: "0"
    volumes:
      - docs:/data/documents
    ports:
      - "${APP_PORT:-8787}:8080"

volumes:
  pgdata:
  docs:
