# Live development: the app runs the code in this folder instead of the published image.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# server/src or server/migrations changes: docker compose -f docker-compose.yml -f docker-compose.dev.yml restart app
# server/package.json changes (new dependencies): run the up -d --build command again.
# frontend/ changes: hot reload, nothing to do. https://money.local updates by itself as you save.
#   The 'vite' container runs the Vite dev server; the app forwards every page and file to it (VITE_DEV_URL).
# Back to the published image: docker compose up -d --force-recreate app
services:
  app:
    environment:
      VITE_DEV_URL: http://vite:5173
    networks: [backend, scraper_net, egress, vite_net]
    image: moneymanager-dev
    build:
      context: .
      dockerfile: server/Dockerfile
    volumes:
      - ./server/src:/app/server/src:ro
      - ./server/migrations:/app/server/migrations:ro
      - ./CHANGELOG.md:/app/CHANGELOG.md:ro
      - ./CHANGELOG.he.md:/app/CHANGELOG.he.md:ro
  vite:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /src/frontend
    environment:
      VITE_POLL: "1"   # notice every file change in the shared folder (see vite.config.js)
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./frontend:/src/frontend
      - vite_node_modules:/src/frontend/node_modules
    networks: [vite_net]
networks:
  vite_net: {}    # not internal: the Vite container needs the internet once, to install its packages
volumes:
  vite_node_modules:
