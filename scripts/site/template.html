<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{SITE}}">
<meta property="og:title" content="{{OGTITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta name="twitter:card" content="summary">
<link rel="icon" href="{{ROOT}}assets/icon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem("mm-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="{{ROOT}}assets/site.css">
<script src="{{ROOT}}assets/site.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<header class="topbar">
  <button class="icon-btn menu-btn" type="button" aria-label="Open the menu" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="{{HOME}}"><span class="logo" aria-hidden="true">{{ICON}}</span><span class="brand-name">{{SITE}}</span></a>
  <span class="spacer"></span>
  <button class="icon-btn theme-btn" type="button" aria-label="Switch between light and dark">
    <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
    <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
  <a class="gh-link" href="{{REPO}}" rel="noopener">
    <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    <span>GitHub</span>
  </a>
</header>
<div class="scrim" hidden></div>
<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Pages">
    <nav><ul class="nav-list">
{{NAV}}
    </ul></nav>
  </aside>
  <main id="main" class="content" tabindex="-1">
    <article class="doc">
{{CONTENT}}
    </article>
    {{PAGER}}
    <footer class="foot"><span>{{EDIT}}</span><span>{{SITE}}. Your money stays on your own computer.</span></footer>
  </main>
  <aside class="toc" aria-label="On this page">
    <p class="toc-title">On this page</p>
    <ul>{{TOC}}</ul>
  </aside>
</div>
<div class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image"><img alt=""><button type="button" class="icon-btn lb-close" aria-label="Close">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
</body>
</html>
