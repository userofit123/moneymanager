# Builds the Windows installer (Money Manager Setup.exe). Run it by hand (Actions -> Windows desktop app -> Run workflow),
# or push a tag like v1.2.0 to also publish it as a GitHub release of this repository, which is what installed copies check for updates.
name: Windows desktop app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/desktop/chrome   # the scraper's browser is downloaded here and shipped inside the installer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --omit=dev
        working-directory: server
      - run: npm ci --omit=dev
        working-directory: scraper
      - name: Ship the dependencies as app_modules (the installer builder skips folders named node_modules)
        shell: pwsh
        run: |
          Rename-Item server/node_modules app_modules
          Rename-Item scraper/node_modules app_modules
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - name: Version and release notes from the tag and CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          npm version $v --no-git-tag-version --allow-same-version
          $log = Get-Content ../CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[?v?" + [regex]::Escape($v) + "\]?[^\n]*\n(.*?)(?=^## |\z)")
          if ($m.Success) { Set-Content release-notes.md $m.Groups[1].Value.Trim() } else { Set-Content release-notes.md "See CHANGELOG.md" }
      - name: Build the installer
        working-directory: desktop
        run: npm run ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dist' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v5
        with:
          name: money-manager-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
