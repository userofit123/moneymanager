# Releases and builds, automatic.
#  - Every push and pull request runs the tests.
#  - Merging to main with a NEW top version in CHANGELOG.md tags it, builds the Windows installer and publishes a GitHub release.
#    Installed apps (and the Docker version's "Check for updates") see that release.
#  - Publishing a release by hand on GitHub also builds the installer and attaches it.
#  - "Run workflow" builds an installer without publishing anything (to try it).
name: Release
on:
  push: { branches: [main] }
  pull_request:
  release: { types: [published] }
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions: { contents: write }

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: money, POSTGRES_PASSWORD: money, POSTGRES_DB: money_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U money" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { DATABASE_URL: "postgres://money:money@localhost:5432/money_test" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: v
        run: |
          # the newest version in the changelog: the one being released
          version=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          tag="v$version"
          publish=false; build=false
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"; version="${tag#v}"; build=true
          elif [ "${{ github.event_name }}" = "push" ] && [ -z "$(git tag -l "$tag")" ]; then
            publish=true; build=true     # a new version reached main
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"; echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version $version, tag $tag, publish $publish, build $build"

  windows:
    needs: [test, version]
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/desktop/chrome   # the scraper's browser is downloaded here and shipped inside the installer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --omit=dev
        working-directory: server
      - run: npm ci --omit=dev
        working-directory: scraper
      - name: Ship the dependencies as app_modules (the installer builder skips folders named node_modules)
        shell: pwsh
        run: |
          Rename-Item server/node_modules app_modules
          Rename-Item scraper/node_modules app_modules
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - name: Version and release notes
        working-directory: desktop
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          npm version $v --no-git-tag-version --allow-same-version
          $log = Get-Content ../CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[" + [regex]::Escape($v) + "\][^\n]*\n(.*?)(?=^## |\z)")
          if ($m.Success) { Set-Content release-notes.md $m.Groups[1].Value.Trim() } else { Set-Content release-notes.md "See CHANGELOG.md" }
      - name: Tag the release
        if: needs.version.outputs.publish == 'true'
        run: |
          git tag "${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"
      - name: Build the installer
        working-directory: desktop
        run: npm run ${{ (needs.version.outputs.publish == 'true' || github.event_name == 'release') && 'release' || 'dist' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v5
        with:
          name: money-manager-windows-${{ needs.version.outputs.version }}
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
